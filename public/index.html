<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Discoteca">
  <title>Discoteca</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <section id="login" class="login" hidden>
    <form id="loginForm" class="login-card">
      <h1>Discoteca</h1>
      <p class="muted">Introduce la contraseña para entrar.</p>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Contraseña" required>
      <p id="loginError" class="error" hidden></p>
      <button class="btn primary" type="submit">Entrar</button>
    </form>
  </section>

  <section id="bootError" class="login" hidden>
    <div class="login-card" role="alert">
      <h1>Discoteca</h1>
      <p id="bootErrorMsg" class="muted"></p>
      <button id="bootRetry" class="btn primary" type="button">Reintentar</button>
    </div>
  </section>

  <div id="shell" class="shell" hidden>
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" type="button" aria-label="Menú" aria-controls="sidebar" aria-expanded="false"></button>
      <span id="topTitle" class="top-title">Discoteca</span>
      <a id="searchBtn" class="icon-btn" href="#/buscar" aria-label="Buscar en Apple Music"></a>
    </header>
    <aside id="sidebar" class="sidebar" aria-label="Navegación"></aside>
    <div id="scrim" class="scrim"></div>
    <main id="view" class="view"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
